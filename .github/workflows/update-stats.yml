name: Update GitHub Status

on:
  schedule:
    - cron: "0 */12 * * *"      # setiap 12 jam
  workflow_dispatch:             # bisa dijalankan manual dari tab Actions
  push:
    paths:
      - "scripts/gen_stats.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats / languages / streak
        env:
          GH_USER: SofyanTauridOdeMadi
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/streak.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub status cards"
          git push
